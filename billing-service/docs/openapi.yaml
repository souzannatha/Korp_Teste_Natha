openapi: 3.0.3
info:
  title: Billing API
  version: 1.0.0
  description: Invoice creation, queries and print finalization. Product availability is checked at creation; stock is deducted only at print.
servers:
  - url: /
paths:
  /healthy:
    get:
      summary: Check service availability
      responses:
        '200':
          description: Service running
          content:
            application/json:
              schema:
                type: object
                properties:
                  health:
                    type: boolean
                    example: true
  /invoice:
    post:
      summary: Create an open invoice
      description: ID, number and initial status are generated by the database. Numbering is increasing and may have gaps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoice'
            example:
              items:
                - product_code: '001'
                  quantity: 3
      responses:
        '201':
          description: Invoice created without deducting stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/InvalidInventoryResponse'
        '503':
          $ref: '#/components/responses/InventoryUnavailable'
        '504':
          $ref: '#/components/responses/InventoryTimeout'
    get:
      summary: List invoices with their items
      responses:
        '200':
          description: Invoice list; an empty list is returned as []
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'
        '500':
          $ref: '#/components/responses/InternalError'
  /invoice/{id}:
    get:
      summary: Find an invoice with its items
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Invoice found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /invoice/{id}/print:
    post:
      summary: Finalize an open invoice and deduct its stock
      description: No request body is needed. Closed invoices cannot be printed. On failure the invoice remains open and can be retried; stock deductions are idempotent.
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Stock confirmed and invoice closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/InvalidInventoryResponse'
        '503':
          $ref: '#/components/responses/InventoryUnavailable'
        '504':
          $ref: '#/components/responses/InventoryTimeout'
components:
  parameters:
    InvoiceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1
  schemas:
    InvoiceItem:
      type: object
      required: [product_code, quantity]
      properties:
        product_code:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '\S'
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
    CreateInvoice:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InvoiceItem'
    Invoice:
      allOf:
        - $ref: '#/components/schemas/CreateInvoice'
        - type: object
          required: [id, number, status]
          properties:
            id:
              type: integer
              minimum: 1
              readOnly: true
            number:
              type: integer
              minimum: 1
              readOnly: true
            status:
              type: string
              enum: [open, closed]
              readOnly: true
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: invalid request body
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict with current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidInventoryResponse:
      description: Invalid response from Inventory
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InventoryUnavailable:
      description: Inventory unavailable; retry once the service recovers
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InventoryTimeout:
      description: Inventory timed out; a deduction may have committed, so retry the same invoice
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
