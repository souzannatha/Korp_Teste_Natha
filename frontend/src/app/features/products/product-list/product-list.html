<section class="page-heading">
  <div>
    <h1>Produtos</h1>
    <p>Consulte os produtos cadastrados e seus saldos atuais.</p>
  </div>
  <a mat-flat-button routerLink="/products/new">Novo produto</a>
</section>

<mat-card>
  <mat-card-content>
    @if (loading()) {
      <div class="state-message">
        <mat-spinner diameter="36" />
        <span>Carregando produtos...</span>
      </div>
    } @else if (products().length === 0) {
      <div class="state-message">Nenhum produto cadastrado.</div>
    } @else {
      <div class="table-wrapper">
        <table mat-table [dataSource]="products()">
          <ng-container matColumnDef="code">
            <th mat-header-cell *matHeaderCellDef>Código</th>
            <td mat-cell *matCellDef="let product">{{ product.code }}</td>
          </ng-container>

          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Descrição</th>
            <td mat-cell *matCellDef="let product">{{ product.description }}</td>
          </ng-container>

          <ng-container matColumnDef="balance">
            <th mat-header-cell *matHeaderCellDef>Saldo</th>
            <td mat-cell *matCellDef="let product">{{ product.balance }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    }
  </mat-card-content>
</mat-card>
